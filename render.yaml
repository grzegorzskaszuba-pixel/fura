services:
  - type: web
    name: fura-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci
    startCommand: npm run api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: AUTH_STORAGE
        value: postgres
      - key: AUTH_DATABASE_SSL
        value: require
      - key: AUTH_API_HOST
        value: 0.0.0.0
      - key: AUTH_COOKIE_SAME_SITE
        value: Lax
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_DATABASE_MAX_ATTEMPTS
        value: "8"
      - key: AUTH_DATABASE_RETRY_DELAY_MS
        value: "250"
      - key: AUTH_DATABASE_RETRY_MAX_DELAY_MS
        value: "5000"
      - key: AUTH_DATABASE_RETRY_MAX_ELAPSED_MS
        value: "30000"
      - key: AUTH_DATABASE_CONNECTION_TIMEOUT_MS
        value: "6000"
      - key: DATABASE_URL
        fromDatabase:
          name: fura-db
          property: connectionString
      # Update this after first deploy if your frontend URL differs.
      - key: AUTH_API_ALLOWED_ORIGINS
        value: https://fura.info,https://www.fura.info,https://fura-web.onrender.com

  - type: web
    name: fura-web
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
      # Update if your API hostname differs.
      - key: VITE_API_BASE_URL
        value: https://api.fura.info/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: fura-db
    plan: free
    databaseName: fura
    user: fura_user
