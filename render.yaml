services:
  - type: web
    name: fura-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci
    startCommand: npm run api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: AUTH_STORAGE
        value: postgres
      - key: AUTH_DATABASE_SSL
        value: require
      - key: AUTH_API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: fura-db
          property: connectionString
      # Update this after first deploy if your frontend URL differs.
      - key: AUTH_API_ALLOWED_ORIGINS
        value: https://fura-web.onrender.com

  - type: web
    name: fura-web
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
      # Update if your API hostname differs.
      - key: VITE_API_BASE_URL
        value: https://fura-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: fura-db
    plan: free
    databaseName: fura
    user: fura_user
